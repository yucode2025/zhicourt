# Render exclusively with deploy/render.py; location add_header replaces inherited headers.
server {
    __LISTEN_DIRECTIVES__
    server_name __SERVER_NAME__;
    __TLS_DIRECTIVES__
    client_max_body_size 1m;
    root "__APP_DIR__/current/frontend/dist";
    index index.html;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Every response is blocked during maintenance (including cached SPA/API responses).
    if (-f /var/lib/zhicourt/maintenance) { return 503; }
    __SECURITY_HEADERS__

    __PROD_DOCS_BLOCK__

    location /shared-assets/ {
        alias /var/lib/zhicourt/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        __SECURITY_HEADERS__
    }
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
        __SECURITY_HEADERS__
    }
    # OAuth authorization code/state may be present in the query string; do not log or cache it.
    # Exact match takes priority over the SPA fallback. add_header resets inherited headers.
    location = /login/zhihu {
        access_log off;
        # Stay in this exact location while serving the SPA entrypoint.
        rewrite ^ /index.html? break;
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
        __OAUTH_SECURITY_HEADERS__
    }
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-cache" always;
        __SECURITY_HEADERS__
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host __SERVER_NAME__;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        __SECURITY_HEADERS__
    }
}
