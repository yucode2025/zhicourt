name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend lint, types, tests and coverage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Install pinned development lock
        run: |
          python -m pip install -r backend/requirements-dev.lock
          python -m pip check
      - name: Ruff
        run: python -m ruff check backend/app backend/migrations backend/scripts backend/tests
      - name: Mypy
        run: python -m mypy
      - name: Pytest with coverage and strict deprecations
        working-directory: backend
        run: >-
          python -m pytest
          --cov=app
          --cov-branch
          --cov-config=../pyproject.toml
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-fail-under=60

  mariadb:
    name: MariaDB migrations and Redis
    runs-on: ubuntu-22.04
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: ci_root_only
          MARIADB_DATABASE: zhicourt
          MARIADB_USER: zhicourt
          MARIADB_PASSWORD: ci_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping" --health-interval=10s
          --health-timeout=5s --health-retries=10
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: zhicourt
      DB_PASSWORD: ci_password
      DB_NAME: zhicourt
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install pinned runtime lock
        run: |
          python -m pip install -r requirements.lock
          python -m pip check
      - name: Upgrade empty MariaDB twice
        run: |
          python -m alembic upgrade head
          python -m alembic upgrade head
      - name: Run Alembic drift check with explicit legacy constraint baseline
        run: |
          set +e
          output="$(python -m alembic check 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          python - <<'PY'
          from alembic.autogenerate import compare_metadata
          from alembic.migration import MigrationContext
          from sqlalchemy import create_engine

          from app.core.config import settings
          from app.models import Base

          engine = create_engine(settings.database_url)
          with engine.connect() as connection:
              diffs = compare_metadata(MigrationContext.configure(connection), Base.metadata)
          engine.dispose()
          found = [(operation, getattr(subject, "name", None)) for operation, subject in diffs]
          expected = [
              ("remove_constraint", "uq_anonymous_sessions_user_id"),
              ("remove_index", "ix_anonymous_sessions_user_id"),
              ("add_index", "ix_anonymous_sessions_user_id"),
              ("remove_index", "ix_verdicts_case_id"),
              ("add_index", "ix_verdicts_case_id"),
              ("add_constraint", "uq_verdicts_case_id"),
          ]
          assert found == expected, f"unexpected Alembic drift: {found}"
          print("Only the documented unique-index representation drift remains.")
          PY
      - name: Verify metadata, database schema and migration heads
        run: |
          python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          from sqlalchemy import create_engine, inspect, text

          from app.core.config import settings
          from app.models import Base

          expected_tables = set(Base.metadata.tables)
          assert len(expected_tables) == 26, f"expected 26 mapped tables, got {len(expected_tables)}"
          expected_heads = set(ScriptDirectory.from_config(Config("alembic.ini")).get_heads())
          engine = create_engine(settings.database_url)
          with engine.connect() as connection:
              actual_tables = set(inspect(connection).get_table_names())
              actual_heads = set(connection.execute(text("SELECT version_num FROM alembic_version")).scalars())
          engine.dispose()
          assert actual_tables == expected_tables | {"alembic_version"}, (
              f"schema mismatch: missing={expected_tables - actual_tables}, "
              f"unexpected={actual_tables - expected_tables - {'alembic_version'}}"
          )
          assert actual_heads == expected_heads, (actual_heads, expected_heads)
          PY
      - name: Verify Redis connectivity
        run: |
          python - <<'PY'
          import redis

          client = redis.Redis.from_url("redis://127.0.0.1:6379/0")
          assert client.ping()
          client.set("ci:health", "ok", ex=30)
          assert client.get("ci:health") == b"ok"
          PY

  frontend:
    name: Frontend test, build, mocked E2E and audit
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Mocked browser E2E
        run: npm run test:e2e
      - name: Audit all frontend dependencies
        run: npm audit --audit-level=high

  deployment:
    name: Deployment configuration checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install pinned runtime lock
        run: |
          python -m pip install -r backend/requirements.lock
          python -m pip check
      - name: Install static validators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y rsync shellcheck nginx
          # Official actionlint release; version and archive digest are pinned.
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz -o /tmp/actionlint.tar.gz
          echo '023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  /tmp/actionlint.tar.gz' | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
      - name: Validate scripts and workflow
        run: |
          bash -n deploy/*.sh
          shellcheck deploy/*.sh
          bash deploy/deploy.sh --self-test
          PYTHONDONTWRITEBYTECODE=1 python -m py_compile deploy/render.py deploy/run-with-env.py
          python deploy/render.py --self-test
          /tmp/actionlint -color
      - name: Render and test deployment configurations
        run: |
          sudo mkdir -p /etc/letsencrypt/live/court.example.com /etc/nginx/sites-available /var/lib/zhicourt/assets
          sudo openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=court.example.com' -keyout /etc/letsencrypt/live/court.example.com/privkey.pem -out /etc/letsencrypt/live/court.example.com/fullchain.pem >/dev/null 2>&1
          sudo mkdir -p /opt/zhicourt/current/frontend/dist
          printf 'APP_ENV=prod\nALLOW_INSECURE_HTTP=false\nPUBLIC_ORIGIN=https://court.example.com\nCORS_ORIGINS=https://court.example.com\nTRUSTED_HOSTS=court.example.com\n' > /tmp/zhicourt-ci.env
          python deploy/render.py nginx --app-dir /opt/zhicourt --app-user zhicourt --env-file /tmp/zhicourt-ci.env --mode https --output /tmp/zhicourt-site
          python deploy/render.py service --app-dir /opt/zhicourt --app-user zhicourt --env-file /tmp/zhicourt-ci.env --output /tmp/zhicourt.service
          ! grep -Eq '__[A-Z_]+__' /tmp/zhicourt-site /tmp/zhicourt.service
          grep -q 'EnvironmentFile="/tmp/zhicourt-ci.env"' /tmp/zhicourt.service
          grep -q 'WorkingDirectory="/opt/zhicourt/current/backend"' /tmp/zhicourt.service
          grep -q 'ExecStart="/opt/zhicourt/current/backend/.venv/bin/uvicorn"' /tmp/zhicourt.service
          grep -q 'root "/opt/zhicourt/current/frontend/dist";' /tmp/zhicourt-site
          sudo cp /tmp/zhicourt-site /etc/nginx/sites-enabled/zhicourt
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo nginx -t
          grep -q 'Content-Security-Policy-Report-Only' /tmp/zhicourt-site
          grep -q 'Permissions-Policy' /tmp/zhicourt-site
          grep -q 'listen 80 default_server' /tmp/zhicourt-site
          grep -q 'listen 443 ssl default_server' /tmp/zhicourt-site
          grep -q 'return 308 https://court.example.com$request_uri' /tmp/zhicourt-site
          ! grep -q 'https://$host' /tmp/zhicourt-site
          grep -q 'proxy_set_header Host court.example.com;' /tmp/zhicourt-site
          grep -q 'location = /api/docs { return 404; }' /tmp/zhicourt-site
          grep -q 'location = /api/openapi.json { return 404; }' /tmp/zhicourt-site
          python - <<'PY'
          from pathlib import Path

          site = Path('/tmp/zhicourt-site').read_text()
          callback = site.split('location = /login/zhihu {', 1)[1].split('\n    }', 1)[0]
          assert 'access_log off;' in callback
          assert 'add_header Cache-Control "no-store" always;' in callback
          for header in ('X-Content-Type-Options', 'X-Frame-Options', 'Referrer-Policy "no-referrer"',
                         'Permissions-Policy', 'Content-Security-Policy-Report-Only',
                         'Strict-Transport-Security'):
              assert header in callback, header
          PY
          cp /tmp/zhicourt-ci.env /tmp/zhicourt-bad-host.env
          sed -i 's/TRUSTED_HOSTS=court.example.com/TRUSTED_HOSTS=other.example.com/' /tmp/zhicourt-bad-host.env
          ! python deploy/render.py nginx --app-dir /opt/zhicourt --app-user zhicourt --env-file /tmp/zhicourt-bad-host.env --mode https --output /tmp/should-not-render
          ! python deploy/render.py nginx --app-dir 'C:\\prod\\zhicourt' --app-user zhicourt --env-file /tmp/zhicourt-ci.env --mode https --output /tmp/should-not-render
          cp /tmp/zhicourt-ci.env /tmp/zhicourt-preflight.env
          printf 'DB_HOST=127.0.0.1\nDB_PORT=3306\nDB_USER=zhicourt\nDB_PASSWORD=ci_password\nDB_NAME=zhicourt\nSECRET_ENCRYPTION_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=\n' >> /tmp/zhicourt-preflight.env
          test "$(python deploy/render.py --preflight --env-file /tmp/zhicourt-preflight.env --backend-dir backend)" = $'https\nzhicourt'
          printf 'NGINX_CSP_MODE=enforce\n' >> /tmp/zhicourt-ci.env
          python deploy/render.py nginx --app-dir /opt/zhicourt --app-user zhicourt --env-file /tmp/zhicourt-ci.env --mode https --output /tmp/zhicourt-site
          grep -q 'add_header Content-Security-Policy "' /tmp/zhicourt-site
          printf 'APP_ENV=dev\nALLOW_INSECURE_HTTP=true\nPUBLIC_ORIGIN=http://127.0.0.1\n' > /tmp/zhicourt-ci.env
          python deploy/render.py nginx --app-dir /opt/zhicourt --app-user zhicourt --env-file /tmp/zhicourt-ci.env --mode http --output /tmp/zhicourt-site
          sudo cp /tmp/zhicourt-site /etc/nginx/sites-enabled/zhicourt
          sudo nginx -t
