[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [
  "backend/.venv",
  "backend/test-results",
  "frontend",
]

[tool.ruff.lint]
# Enforce parser and runtime-correctness rules now; broaden this baseline as
# existing style and unused-code debt is removed.
select = ["E4", "E7", "E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.10"
# A warning-free baseline for outbound URL/SSRF controls. Imported modules are
# used for type information but reported only when promoted into this list.
files = [
  "backend/app/core/url_guard.py",
  "backend/app/services/outbound_security.py",
]
exclude = ["backend/.venv"]
follow_imports = "silent"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
show_error_codes = true
pretty = true
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 60
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]

[tool.coverage.xml]
output = "coverage.xml"
